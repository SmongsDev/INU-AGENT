# main.yml
name: Python CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh/
          echo "${{ secrets.INU_SDEV3_KEY }}" > ~/.ssh/inu-sdev3.pem
          chmod 600 ~/.ssh/inu-sdev3.pem

          cat >> ~/.ssh/config << EOL
          Host inu-public
            HostName ${{ secrets.INU_PUBLIC_HOST }}
            User ec2-user
            IdentityFile ~/.ssh/inu-sdev3.pem
            StrictHostKeyChecking no

          Host inu-sdev3
            HostName 10.0.1.100
            User ec2-user
            IdentityFile ~/.ssh/inu-sdev3.pem
            ProxyCommand ssh inu-public -W %h:%p
            StrictHostKeyChecking no
          EOL

      - name: Deploy to EC2
        run: |
          ssh inu-sdev3 '
            cd /home/ec2-user/INU-AGENT &&
            echo "=== Starting deployment ===" &&
            git pull origin main &&
            echo "=== Git pull completed ===" &&
            source venv/bin/activate &&
            echo "=== Virtual environment activated ===" &&
            echo "Python version: $(python --version)" &&
            echo "Current directory: $(pwd)" &&
            python3 -m pip install --upgrade pip &&
            pip install -r requirements.txt &&
            echo "=== Dependencies installed ===" &&
            # 기존 uvicorn 프로세스 종료
            echo "=== Killing existing uvicorn processes ===" &&
            pkill -f "uvicorn app.main:app" || true &&
            sleep 2 &&
            echo "=== Checking if uvicorn is available ===" &&
            which uvicorn &&
            uvicorn --version &&
            echo "=== Starting uvicorn ===" &&
            # uvicorn으로 애플리케이션 실행 (백그라운드)
            nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4 --log-level info > uvicorn.log 2>&1 & &&
            echo "=== Uvicorn started with PID: $! ===" &&
            sleep 3 &&
            echo "=== Checking if process is running ===" &&
            ps aux | grep uvicorn | grep -v grep &&
            echo "=== Deployment completed ==="
          '
