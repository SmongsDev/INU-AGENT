# main.yml
name: Python CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh/
          echo "${{ secrets.INU_SDEV3_KEY }}" > ~/.ssh/inu-sdev3.pem
          chmod 600 ~/.ssh/inu-sdev3.pem

          cat >> ~/.ssh/config << EOL
          Host inu-public
            HostName ${{ secrets.INU_PUBLIC_HOST }}
            User ec2-user
            IdentityFile ~/.ssh/inu-sdev3.pem
            StrictHostKeyChecking no

          Host inu-sdev3
            HostName 10.0.1.100
            User ec2-user
            IdentityFile ~/.ssh/inu-sdev3.pem
            ProxyCommand ssh inu-public -W %h:%p
            StrictHostKeyChecking no
          EOL

      - name: Deploy to EC2
        run: |
          ssh inu-sdev3 '
            cd /home/ec2-user/INU-AGENT &&
            git pull origin main &&
            source venv/bin/activate &&
            python3 -m pip install --upgrade pip &&
            pip install -r requirements.txt &&
            
            # 8000번 포트 사용하는 프로세스 종료
            pid=$(lsof -ti:8000)
            if [ ! -z "$pid" ]; then
              echo "Killing process using port 8000: $pid"
              kill -9 $pid || true
            fi &&
            
            # FastAPI 서버를 백그라운드로 실행
            nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 --log-level info > uvicorn.log 2>&1 &
          '
